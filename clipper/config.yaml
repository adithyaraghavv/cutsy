# clipper configuration. Every key is optional; missing keys use built-in defaults.

# Signal weights for the combined per-0.5s score (applied to z-scores).
# Signals that are unavailable (no heatmap, no chat) are skipped and the
# remaining weights are renormalised.
weights:
  audio_rms: 1.0
  audio_rise: 1.0
  motion: 1.0
  heatmap: 1.5
  chat: 1.5
  chat_funny: 1.5      # chat spamming laughs / cringe / "clip it" (needs the chat replay)

candidates:
  count: 15            # greedy non-overlapping windows kept
  top_fraction: 0.2    # window score = mean(top 20% of bins) + mean_weight * mean
  mean_weight: 0.5
  stride_s: 1.0        # window slide step

signals:
  rise_lookback_s: 4.0   # "sudden rise" compares RMS to the previous N seconds
  chat_baseline_s: 30.0  # chat spike = rate minus the previous N seconds' mean

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 21
  audio_bitrate: 160k
  loudness_lufs: -14
  hook_seconds: 2.6
  hook_fontsize: 88
  hook_wrap_chars: 16
  max_height_download: 1080
  layout: blur           # blur = footage centred on a blurred background | split = facecam on top, gameplay below
  facecam: null          # for split: [x, y, w, h] as fractions of the frame, e.g. [0.72, 0.55, 0.28, 0.45] (see --grid-frame)
  gameplay: null         # for split: [x, y, w, h] region used for the bottom panel (default: whole frame); e.g. [0.30, 0.05, 0.70, 0.90] to skip the webcam corner
  split_top_px: 900      # height of the top (facecam) panel in the 1080x1920 canvas
  title_style: box       # box = white box with black bold text (headline style) | outline = white text, black outline
  title_fontsize: 54
  title_wrap_chars: 28
  title_seconds: 0       # 0 = headline stays for the whole clip

captions:              # used with --captions (needs: pip install faster-whisper)
  model: base.en       # tiny.en (fastest) | base.en | small.en (more accurate) ; use e.g. "base" for other languages
  language: en
  chunk_words: 2
  fontsize: 96
  margin_v: 430        # distance from bottom, keeps text above Reels/Shorts UI
  highlight_bgr: 00D7FF  # key-word colour in BGR hex (gold)

scan:
  min_gap_s: 180         # --scan keeps chosen moments at least this many seconds apart
  bucket_s: 900          # --scan on a long stream spreads the picks over one time slice per this many seconds (0 = off)
  min_motion: 0.25       # drop moments whose picture is frozen/static (NO SIGNAL screens); 0 turns the check off

cache_dir: .clipper-cache
