[project]
name = "clipper"
version = "0.1.0"
description = "Turn long YouTube/Twitch VODs into vertical 9:16 clips using signal analysis (and later Claude as judge)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
